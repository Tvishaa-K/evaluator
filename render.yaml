# Render Blueprint. The app is stateless — no disk — so it runs on the free
# instance type. Postgres lives on Neon because Render's free database is
# deleted 30 days after creation.
services:
  - type: web
    name: evaluator
    runtime: docker
    plan: free             # spins down after 15 min idle, ~1 min cold start
    region: singapore
    healthCheckPath: /healthz   # must be unauthenticated; see basic_auth in app/main.py
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PIPELINE_WORKERS
        value: "2"
      # Set all of these in the dashboard; never commit them.
      - key: DATABASE_URL      # Neon URL; app/db.py normalizes the scheme to +psycopg
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
